<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム - Question Knock</title>
    <th:block th:replace="~{fragments/header :: style}"></th:block>
    
    <style>
        /* === 配色定義 === */
        :root {
            --bg-color: #fecd1a;      /* 中黄 */
            --main-border: #1e2749;   /* 藍色 */
            --accent-white: #ffffff;  /* 白 */
            --accent-red: #e73228;    /* 赤 */
            --shadow-color: #1e2749;  /* 影 */
            --notebook-line: #aebec6; /* ノート罫線 */
        }

        body {
            background-color: var(--bg-color);
            background-image: none;
            font-family: "Press Start 2P", "DotGothic16", monospace;
            color: var(--main-border);
            padding-top: 140px; /* ログアウトボタンとの干渉を避けるため少し広めに */
            padding-bottom: 40px;
            margin: 0;
            overflow-x: hidden; /* 横揺れ防止 */
        }

        .dashboard-container { max-width: 1100px; margin: 0 auto; padding: 0 15px; box-sizing: border-box; }

        /* === 共通ボックス === */
        .pixel-box {
            background: var(--accent-white);
            border: 4px solid var(--main-border);
            box-shadow: 6px 6px 0px var(--shadow-color);
            padding: 30px;
            position: relative;
            box-sizing: border-box;
        }

        /* === レイアウト === */
        .dashboard-grid {
            display: grid; grid-template-columns: 350px 1fr; gap: 40px;
        }

        /* === ログアウトボタン === */
        .logout-container { 
            position: absolute; top: 90px; left: 15px; z-index: 100; 
        }
        
        .logout-btn {
            display: inline-block;
            background: var(--main-border);
            color: var(--accent-white);
            border: 4px solid var(--main-border);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            padding: 10px 15px;
            font-family: "DotGothic16", monospace; /* 読みやすさのため */
            font-size: 0.9rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .logout-btn:hover {
            background: var(--accent-red);
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        /* === 左側: プロフィール === */
        .profile-section { text-align: center; height: fit-content; background: var(--accent-white); }
        
        .profile-img-container {
            position: relative; width: 140px; height: 140px;
            margin: 0 auto 25px auto; cursor: pointer;
        }
        .profile-img-container:hover .profile-img { border-color: var(--accent-red); }

        .profile-img {
            width: 100%; height: 100%; object-fit: cover;
            border: 4px solid var(--main-border);
            background: #eee;
        }
        
        .edit-icon-overlay {
            position: absolute; bottom: -5px; right: -5px;
            background: var(--accent-red); 
            color: white;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border: 4px solid var(--main-border);
            font-size: 1.2rem;
            z-index: 2;
        }
        .edit-icon-overlay::after { content: "✎"; }

        .user-name { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.4; display: block; word-break: break-all; }
        
        .btn-edit-profile {
            display: inline-block;
            background: var(--main-border); 
            color: white;
            border: 4px solid var(--main-border);
            box-shadow: 4px 4px 0px var(--shadow-color);
            padding: 10px 20px;
            font-family: inherit; font-size: 0.8rem; text-decoration: none;
            cursor: pointer; transition: background 0.2s;
            width: 100%; box-sizing: border-box;
        }
        .btn-edit-profile:hover { background: var(--accent-red); }

        /* === 右側: ステータスエリア === */
        .stats-section { display: flex; flex-direction: column; gap: 40px; }

        .rank-card-box { background: transparent; border: none; box-shadow: none; padding: 0; }
        
        .rank-header {
            background: var(--main-border); color: white;
            display: inline-flex; align-items: center; gap: 10px;
            padding: 8px 15px; margin-bottom: 20px; font-size: 0.9rem;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        .rank-container { display: flex; gap: 20px; }
        
        .rank-item {
            flex: 1; padding: 15px 5px;
            border: 4px solid var(--main-border);
            text-align: center;
            background: var(--accent-white); 
            box-shadow: 6px 6px 0px var(--shadow-color);
        }
        
        .rank-title { font-size: 0.7rem; margin-bottom: 10px; display: block; border-bottom: 2px solid var(--main-border); padding-bottom: 5px; }
        .rank-value {
            font-size: clamp(2rem, 8vw, 3.5rem); font-weight: bold;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }
        .rank-S { color: #f1c40f; text-shadow: 2px 2px 0px var(--main-border); }
        .rank-A { color: var(--accent-red); }
        .rank-B { color: var(--main-border); }
        .rank-C { color: #2ecc71; }
        .rank-E { color: #ccc; }
        .rank-D { color: var(--main-border); }

        .rank-detail-link {
            color: var(--main-border); font-family: inherit; font-size: 0.8rem;
            text-decoration: none; cursor: pointer; margin-top: 15px; display: inline-block;
        }

        /* === 目標シート === */
        .goal-card {
            background: #fdfbf7; 
            border: 4px solid var(--main-border);
            box-shadow: 6px 6px 0px var(--shadow-color);
            padding: 20px; position: relative; color: var(--main-border);
            background-image: linear-gradient(transparent 31px, var(--notebook-line) 32px);
            background-size: 100% 32px; background-position: 0 10px;
        }
        
        .goal-label { 
            font-size: 1rem; margin-bottom: 10px; 
            color: var(--accent-red); font-weight: bold;
            background: #fdfbf7; display: inline-flex; align-items: center; padding-right: 10px;
        }
        
        .goal-direct-input {
            width: 100%; height: 96px;
            background: transparent; border: none;
            color: var(--main-border); font-size: 1rem; line-height: 32px;
            padding: 0; resize: none; font-family: inherit; outline: none;
        }

        .goal-mini-btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--main-border); color: var(--accent-white);
            width: 44px; height: 44px; margin-top: 10px;
            border: 4px solid var(--main-border);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .goal-mini-btn::after { content: "✎"; }

        /* モーダル調整 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 39, 73, 0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; visibility: hidden; transition: 0.2s;
            padding: 10px; box-sizing: border-box;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .profile-card-modal {
            background: var(--accent-white);
            border: 4px solid var(--main-border);
            box-shadow: 6px 6px 0px var(--shadow-color);
            padding: 20px; width: 100%; max-width: 400px; text-align: center;
            position: relative; box-sizing: border-box;
            max-height: 90vh; overflow-y: auto;
        }

        .close-modal-btn {
            position: absolute; top: 5px; right: 10px;
            font-size: 2rem; color: var(--main-border); cursor: pointer; background: none; border: none;
        }

        /* === レスポンシブ (スマホ向け) === */
        @media (max-width: 768px) {
            body { padding-top: 130px; }
            .dashboard-grid { grid-template-columns: 1fr; gap: 20px; }
            .logout-container { top: 80px; }
            .profile-section { padding: 20px; }
            .rank-container { gap: 10px; }
            .rank-item { padding: 10px 5px; }
            .rank-value { font-size: 2.5rem; }
            .pixel-box { padding: 20px; }
        }
    </style>
</head>
<body>
    <nav th:replace="~{fragments/header :: part}"></nav>

    <div class="logout-container">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">← LOGOUT</button>
        </form>
    </div>

    <div class="dashboard-container">
        <div class="dashboard-grid">
            <div class="pixel-box profile-section">
                <div class="profile-img-container" onclick="openProfileModal()">
                    <img th:if="${user.iconBase64 != null}" th:src="${user.iconBase64}" class="profile-img">
                    <img th:if="${user.iconBase64 == null}" src="/images/default_avatar.png" class="profile-img">
                    <div class="edit-icon-overlay"></div>
                </div>
                <div class="user-name" th:text="${user.nickname}">Player 1</div>
                <button type="button" class="btn-edit-profile" onclick="openProfileModal()">EDIT PROFILE</button>
            </div>

            <div class="stats-section">
                <div class="rank-card-box">
                    <div class="rank-header">CURRENT RANK</div>
                    <div class="rank-container">
                        <div class="rank-item">
                            <span class="rank-title">BASIC</span>
                            <span class="rank-value" th:classappend="'rank-' + ${basicRank}" th:text="${basicRank}">-</span>
                        </div>
                        <div class="rank-item">
                            <span class="rank-title">APPLIED</span>
                            <span class="rank-value" th:classappend="'rank-' + ${appliedRank}" th:text="${appliedRank}">-</span>
                        </div>
                    </div>
                    <div style="text-align:right;">
                       <a th:href="@{/rank/view}" class="rank-detail-link">VIEW DETAILS →</a>
                    </div>
                </div>

                <div class="goal-card">
                    <div class="goal-label">MY GOAL</div>
                    <form th:action="@{/profile/goal}" method="post" style="width:100%; position:relative; z-index: 2;">
                        <textarea name="goal" class="goal-direct-input" placeholder="CLICK TO TYPE GOAL..." th:text="${userGoal}"></textarea>
                        <div style="text-align: right;">
                            <button type="submit" class="goal-mini-btn" title="UPDATE"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="profileModal">
        <div class="profile-card-modal">
            <button type="button" class="close-modal-btn" onclick="closeProfileModal()">×</button>
            <h2 style="font-size:1rem; margin-bottom:20px;">EDIT PROFILE</h2>
            <form th:action="@{/profile/update}" method="post" enctype="multipart/form-data">
                <div class="file-upload-area" style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:20px;">
                    <div class="preview-circle" style="width:100px; height:100px; border:4px solid var(--main-border); background:#eee; display:flex; justify-content:center; align-items:center; overflow:hidden;">
                        <img id="previewImg" class="preview-img-modal" th:src="${user.iconBase64 != null ? user.iconBase64 : ''}" th:style="${user.iconBase64 != null ? 'width:100%;height:100%;object-fit:cover;' : 'display:none;'}">
                        <span id="previewPlaceholder" th:style="${user.iconBase64 != null ? 'display:none;' : ''}" style="font-size:2rem;">👾</span>
                    </div>
                    <label class="file-select-btn" style="background:#eee; border:4px solid var(--main-border); padding:5px 10px; font-size:0.7rem; cursor:pointer;">
                        SELECT IMAGE
                        <input type="file" name="iconFile" class="file-input" accept="image/*" onchange="previewFile(this)" style="display:none;">
                    </label>
                </div>
                <div class="input-group" style="text-align:left; margin-bottom:20px;">
                    <label style="font-size:0.7rem; display:block; margin-bottom:5px;">NICKNAME</label>
                    <input type="text" name="nickname" class="nickname-input" th:value="${user.nickname}" maxlength="10" style="width:100%; padding:10px; border:4px solid var(--main-border); box-sizing:border-box; font-family:inherit;">
                </div>
                <button type="submit" class="ok-btn" style="width:100%; background:var(--bg-color); border:4px solid var(--main-border); padding:10px; font-family:inherit; cursor:pointer; box-shadow:4px 4px 0px var(--shadow-color);">SAVE CHANGES</button>
            </form>
        </div>
    </div>

    <script>
        function openProfileModal() { document.getElementById('profileModal').classList.add('active'); }
        function closeProfileModal() { document.getElementById('profileModal').classList.remove('active'); }
        function previewFile(input) {
            const file = input.files[0];
            const previewImg = document.getElementById('previewImg');
            const placeholder = document.getElementById('previewPlaceholder');
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
