<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100本ノック & AI先生</title>

    <style>
        /* --- ベース設定 --- */
        body { 
            font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif; 
            background: #f5f5f5; 
            margin: 0; 
            padding: 0; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        /* メインの包み。スマホでは縦並び、PCでは横並び */
        .main-wrapper { 
            display: flex; 
            flex: 1; 
            height: 100%; 
            overflow: hidden; 
            position: relative;
        }

        /* --- クイズエリア --- */
        .quiz-area { 
            flex: 2; 
            padding: 15px; 
            overflow-y: auto; 
            width: 100%; 
            box-sizing: border-box; 
        }

        .quiz-container { 
            max-width: 800px; 
            background: #fff; 
            margin: 0 auto; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }

        h1 { font-size: 1.4rem; margin-top: 0; color: #333; }

        .question-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 20px; 
            gap: 10px;
        }

        /* AI先生ボタン */
        .btn-toggle-ai {
            background: #eef2ff;
            color: #4f46e5;
            border: 1px solid #c7d2fe;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .question-text { 
            font-size: 1.05rem; 
            line-height: 1.7; 
            margin-bottom: 25px; 
            color: #2d3748;
            word-break: break-all;
        }

        /* --- 選択肢 --- */
        .choices { display: flex; flex-direction: column; gap: 12px; }

        .choice-row { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            cursor: pointer;
        }

        .choice-btn { 
            width: 44px; 
            height: 44px; 
            border-radius: 8px; 
            font-size: 1rem; 
            border: 2px solid #e2e8f0; 
            background: #fff; 
            flex-shrink: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #4a5568;
        }

        .choice-text { font-size: 1rem; color: #4a5568; line-height: 1.4; }

        /* 正解・不正解の色 */
        .correct-answer { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .wrong-answer { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }

        /* --- ナビゲーション --- */
        .navigation { 
            margin-top: 30px; 
            display: flex; 
            justify-content: flex-end; 
            gap: 10px; 
        }

        .save-btn, .btn-next, .btn-submit {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .save-btn { background: #edf2f7; color: #4a5568; }
        .btn-next { background: #3b82f6; color: #fff; }

        /* --- AIチャットエリア (スマホではオーバーレイ) --- */
        .ai-area { 
            position: fixed;
            top: 0;
            right: -100%; /* 最初は隠しておく */
            width: 100%;
            height: 100dvh;
            background: #fff;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
        }
        .ai-area.active { right: 0; }

        .ai-header { 
            padding: 15px; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }

        .chat-history { flex: 1; overflow-y: auto; padding: 15px; background: #f8fafc; }

        /* PC版レイアウト (画面が広い時だけ横並び) */
        @media (min-width: 1024px) {
            .ai-area { 
                position: static; 
                flex: 1; 
                right: 0; 
                display: flex; 
                border-left: 1px solid #ddd; 
            }
            .btn-toggle-ai { display: none; } /* PCでは常に表示するのでボタン不要 */
        }
    </style>
</head>

<body>

<div class="main-wrapper">
    <div class="quiz-area">
        <div class="quiz-container">
            <h1>100本ノック</h1>
            
            <div th:each="q, iterStat : ${questions}" th:id="'q-container-' + ${iterStat.index}" class="question-box active">
                <div class="question-header">
                    <h2 th:text="'第 ' + (${iterStat.index}+1) + ' 問'" style="margin:0; font-size:1.1rem;"></h2>
                    <button type="button" class="btn-toggle-ai" onclick="toggleAI()">👨‍🏫 AI先生を表示</button>
                </div>

                <div class="question-text" th:text="${q.questionText}">問題文がここに入ります。</div>

                <div class="choices">
                    <div class="choice-row" th:each="choice, cStat : ${q.choices}" th:onclick="|selectAnswer(this, ${iterStat.index})|">
                        <div class="choice-btn" 
                             th:text="${labels != null ? labels[cStat.index] : cStat.index + 1}"
                             th:data-correct="${choice.isCorrect}">ア</div>
                        <div class="choice-text" th:text="${choice.choiceText}">選択肢のテキスト</div>
                    </div>
                </div>

                <div class="navigation">
                    <button type="button" class="save-btn" onclick="saveAndQuit()">一時保存</button>
                    <button type="button" class="btn-next">次へ</button>
                </div>
            </div>
        </div>
    </div>

    <div class="ai-area" id="aiArea">
        <div class="ai-header">
            <strong>👨‍🏫 AI先生</strong>
            <button onclick="toggleAI()" style="border:none; background:none; font-size:1.5rem;">×</button>
        </div>
        <div class="chat-history">
            <div style="background:#eef2ff; padding:10px; border-radius:8px; font-size:0.9rem;">
                問題について分からないことがあれば聞いてくださいね。
            </div>
        </div>
        <div style="padding:15px; border-top:1px solid #eee; display:flex; gap:8px;">
            <input type="text" style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd;" placeholder="質問を入力...">
            <button style="background:#3b82f6; color:#fff; border:none; padding:0 15px; border-radius:20px;">送信</button>
        </div>
    </div>
</div>

<script>
    function toggleAI() {
        document.getElementById('aiArea').classList.toggle('active');
    }

    function selectAnswer(row, qIndex) {
        const btn = row.querySelector('.choice-btn');
        const isCorrect = btn.getAttribute('data-correct') === 'true';
        
        // すでに回答済みなら何もしない
        if(row.parentElement.classList.contains('answered')) return;
        row.parentElement.classList.add('answered');

        if(isCorrect) {
            btn.classList.add('correct-answer');
        } else {
            btn.classList.add('wrong-answer');
            // 正解のボタンも強調する
            const allBtns = row.parentElement.querySelectorAll('.choice-btn');
            allBtns.forEach(b => {
                if(b.getAttribute('data-correct') === 'true') b.classList.add('correct-answer');
            });
        }
    }
</script>

</body>
</html>
