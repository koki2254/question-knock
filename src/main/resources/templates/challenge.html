<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100本ノック & AI先生</title>
    <style>
        /* --- ベース設定 --- */
        body { 
            font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif; 
            background: #f5f5f5; margin: 0; padding: 0; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden; 
        }
        .main-wrapper { display: flex; flex: 1; height: 100%; overflow: hidden; position: relative; }

        /* --- クイズエリア --- */
        .quiz-area { flex: 2; padding: 15px; overflow-y: auto; width: 100%; box-sizing: border-box; }
        .quiz-container { max-width: 800px; background: #fff; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { font-size: 1.4rem; margin-top: 0; color: #333; }
        
        .question-box { display: none; }
        .question-box.active { display: block; }

        .question-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 10px; }
        .btn-toggle-ai { background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .btn-bookmark { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #ccc; }

        .question-text { font-size: 1.05rem; line-height: 1.7; margin-bottom: 20px; color: #2d3748; }
        .question-image { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 20px; display: block; }

        /* --- 選択肢 --- */
        .choices { display: flex; flex-direction: column; gap: 12px; }
        .choice-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .choice-btn { 
            width: 44px; height: 44px; border-radius: 8px; font-size: 1rem; border: 2px solid #e2e8f0; 
            background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; 
            transition: all 0.2s; color: #4a5568; pointer-events: none; /* rowのクリックで反応させるため */
        }
        .choice-text { font-size: 1rem; color: #4a5568; line-height: 1.4; }
        
        /* 判定エリア */
        .judge-box { display: none; margin-top: 15px; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; }
        .judge-correct { background: #dcfce7; color: #166534; }
        .judge-wrong { background: #fee2e2; color: #991b1b; }
        .explanation-box { display: none; margin-top: 15px; padding: 15px; background: #f8fafc; border-radius: 8px; font-size: 0.95rem; border: 1px solid #e2e8f0; }

        .correct-answer { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .wrong-answer { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }

        /* --- ナビゲーション --- */
        .navigation { margin-top: 30px; display: flex; justify-content: flex-end; gap: 10px; }
        .save-btn, .btn-next, .btn-submit { padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; border: none; cursor: pointer; font-weight: bold; }
        .save-btn { background: #edf2f7; color: #4a5568; }
        .btn-next { background: #3b82f6; color: #fff; display: none; }
        .btn-submit { background: #10b981; color: #fff; display: none; }

        /* --- AIチャットエリア --- */
        .ai-area { position: fixed; top: 0; right: -100%; width: 100%; height: 100dvh; background: #fff; z-index: 1000; display: flex; flex-direction: column; transition: right 0.3s ease; }
        .ai-area.active { right: 0; }
        .ai-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
        .chat-history { flex: 1; overflow-y: auto; padding: 15px; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
        
        .message { padding: 10px 14px; border-radius: 15px; max-width: 85%; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: #3b82f6; color: white; }
        .message.ai { align-self: flex-start; background: #e2e8f0; color: #1e293b; }

        @media (min-width: 1024px) {
            .ai-area { position: static; flex: 1; right: 0; display: flex; border-left: 1px solid #ddd; }
            .ai-header button { display: none; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="quiz-area">
        <div class="quiz-container">
            <h1>100本ノック</h1>
            
            <form id="quizForm" th:action="@{/challenge/submit}" method="post">
                <div th:each="q, iterStat : ${questions}" 
                     th:id="'q-container-' + ${iterStat.index}" 
                     class="question-box" 
                     th:classappend="${iterStat.index == 0} ? 'active' : ''">

                    <input type="hidden" class="hidden-question-text" th:value="${q.questionText}" />

                    <div class="question-header">
                        <h2 th:text="'第 ' + (${iterStat.index}+1) + ' 問'" style="margin:0; font-size:1.1rem;"></h2>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <button type="button" class="btn-toggle-ai" onclick="toggleAI()">👨‍🏫 AI先生に聞く</button>
                            <button type="button" class="btn-bookmark" th:onclick="|toggleBookmark(${q.questionId}, this)|">★</button>
                        </div>
                    </div>

                    <div class="question-text" th:text="${q.questionText}"></div>
                    <img th:if="${q.imageUrl}" th:src="@{${q.imageUrl}}" class="question-image"/>

                    <input type="hidden" th:name="'question_' + ${q.questionId}" th:id="'hidden-answer-' + ${iterStat.index}" />

                    <div class="choices">
                        <div class="choice-row" th:each="choice, cStat : ${q.choices}" 
                             th:onclick="|selectAnswer(this, ${iterStat.index})|">
                            <div class="choice-btn" 
                                 th:text="${labels != null ? labels[cStat.index] : cStat.index + 1}"
                                 th:data-choice-id="${choice.choiceId}"
                                 th:data-correct="${choice.isCorrect}"
                                 th:data-explanation="${q.explanation}"></div>
                            <div class="choice-text" th:text="${choice.choiceText}"></div>
                        </div>
                    </div>

                    <div class="judge-box" th:id="'judge-' + ${iterStat.index}"></div>
                    <div class="explanation-box" th:id="'exp-' + ${iterStat.index}">
                        <strong style="display:block; margin-bottom:5px;">解説</strong>
                        <p class="explanation-text"></p>
                    </div>

                    <div class="navigation">
                        <button type="button" class="save-btn" onclick="saveAndQuit()">中断</button>
                        <button type="button" class="btn-next" th:onclick="'goToNextQuestion(' + (${iterStat.index} + 1) + ')'">次へ</button>
                        <button type="submit" class="btn-submit" th:id="'submitBtn-' + ${iterStat.index}">結果を見る</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="ai-area" id="aiArea">
        <div class="ai-header">
            <strong>👨‍🏫 AI先生チャット</strong>
            <button onclick="toggleAI()">×</button>
        </div>
        <div class="chat-history" id="chat-history">
            <div class="message ai">分からないことがあれば質問してくださいね。</div>
        </div>
        <div style="padding:15px; border-top:1px solid #eee; display:flex; gap:8px; background:#fff;">
            <input type="text" id="user-input" style="flex:1; padding:12px; border-radius:25px; border:1px solid #ddd; font-size:16px;" placeholder="質問を入力..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" style="background:#3b82f6; color:#fff; border:none; padding:0 20px; border-radius:25px; font-weight:bold;">送信</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let currentQuestionIndex = 0;
    const totalQuestions = /*[[${questions.size()}]]*/ 0;

    function toggleAI() {
        document.getElementById('aiArea').classList.toggle('active');
    }

    // 回答選択ロジック
    function selectAnswer(row, qIndex) {
        const questionBox = document.getElementById('q-container-' + qIndex);
        if (questionBox.classList.contains('answered')) return;
        
        const btn = row.querySelector('.choice-btn');
        const isCorrect = btn.getAttribute('data-correct') === 'true';
        const explanation = btn.getAttribute('data-explanation');
        const choiceId = btn.getAttribute('data-choice-id');
        
        questionBox.classList.add('answered');
        document.getElementById('hidden-answer-' + qIndex).value = choiceId;

        // ボタンの色変更
        const allRows = questionBox.querySelectorAll('.choice-btn');
        allRows.forEach(b => {
            if(b.getAttribute('data-correct') === 'true') b.classList.add('correct-answer');
        });
        if(!isCorrect) btn.classList.add('wrong-answer');

        // 判定表示
        const judge = document.getElementById('judge-' + qIndex);
        judge.style.display = 'block';
        judge.innerText = isCorrect ? "○ 正解！" : "× 不正解";
        judge.className = "judge-box " + (isCorrect ? "judge-correct" : "judge-wrong");

        // 解説表示
        const expBox = document.getElementById('exp-' + qIndex);
        expBox.style.display = 'block';
        expBox.querySelector('.explanation-text').innerText = explanation || "解説はありません。";

        // ボタン切り替え
        if (qIndex < totalQuestions - 1) {
            questionBox.querySelector('.btn-next').style.display = 'block';
        } else {
            questionBox.querySelector('.btn-submit').style.display = 'block';
        }
    }

    function goToNextQuestion(nextIndex) {
        document.getElementById('q-container-' + currentQuestionIndex).classList.remove('active');
        document.getElementById('q-container-' + nextIndex).classList.add('active');
        currentQuestionIndex = nextIndex;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if(!text) return;

        addMessage(text, 'user');
        input.value = '';

        const currentBox = document.getElementById('q-container-' + currentQuestionIndex);
        const questionText = currentBox.querySelector('.hidden-question-text').value;

        try {
            const response = await fetch('/api/ai/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ questionText: questionText, userMessage: text })
            });
            const data = await response.json();
            addMessage(data.response, 'ai');
        } catch (e) {
            addMessage("エラーが発生しました。", 'ai');
        }
    }

    function addMessage(text, sender) {
        const history = document.getElementById('chat-history');
        const msg = document.createElement('div');
        msg.className = `message ${sender}`;
        msg.innerText = text;
        history.appendChild(msg);
        history.scrollTop = history.scrollHeight;
    }

    function saveAndQuit() {
        if(confirm("進捗を保存して中断しますか？")) {
            // 元のフォーム送信など中断処理をここに記述
            window.location.href = "/select-course";
        }
    }

    function toggleBookmark(id, btn) {
        // ブックマークAPI呼び出しロジック
        btn.style.color = btn.style.color === 'gold' ? '#ccc' : 'gold';
    }
</script>

</body>
</html>
