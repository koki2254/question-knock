<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>問題一覧</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto; /* コンテンツに合わせて幅を調整 */
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px 8px; /* 上下パディングを少し増やして見やすく */
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            white-space: nowrap; /* ヘッダーの改行を防ぐ */
        }
        
        /* ボタンを包むコンテナのスタイル */
        .action-group {
            display: flex;       /* 横並びにする */
            gap: 8px;           /* ボタン間の隙間 */
            align-items: center; /* 垂直方向の中央揃え */
            min-width: 120px;    /* ボタンが並ぶのに十分な幅を確保 */
        }

        .btn {
            display: inline-block;
            padding: 6px 12px;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            white-space: nowrap; /* ボタン内のテキスト改行を防ぐ */
        }
        .btn-edit {
            background-color: #3498db;
        }
        .btn-delete {
            background-color: #e74c3c;
        }
        /* hover時のエフェクト（任意） */
        .btn:hover {
            opacity: 0.8;
        }

        .btn-back {
            margin-bottom: 10px;
            display: inline-block;
            background-color: #2ecc71;
            padding: 8px 16px;
        }
    </style>
</head>
<body>

    <h1>問題一覧</h1>

    <a href="/admin/dashboard" class="btn btn-back">ダッシュボードに戻る</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>試験種</th>
                <th>年度</th>
                <th>季節</th>
                <th>タグID</th>
                <th>問題番号</th>
                <th>問題文</th>
                <th>アクション</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="q : ${questions}">
                <td th:text="${q.questionId}"></td>
                <td th:text="${q.examCategory} + ' ' + ${q.examSession}"></td>
                <td th:text="${q.year}"></td>
                <td th:text="${q.season}"></td>
                <td th:text="${q.tagId}"></td>
                <td th:text="${q.questionNumber}"></td>
                <td th:text="${q.questionText}"></td>

                <td>
                    <div class="action-group">
                        <a th:href="@{'/admin/question/edit/' + ${q.questionId}}" class="btn btn-edit">編集</a>
                        
                        <form th:action="@{'/admin/question/delete/' + ${q.questionId}}" 
                              method="post" 
                              onsubmit="return confirm('本当に削除しますか？');"
                              style="margin: 0;"> <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-delete">削除</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
